<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JC App - Recompensas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex items-center justify-center p-4">
    
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-center">
        
        <div id="pantalla-login">
            <h1 class="text-3xl font-bold text-blue-600 mb-2">JC App</h1>
            <p class="text-gray-500 mb-6">Ingresa a tu cuenta</p>
            <input type="text" id="username" placeholder="Usuario" class="w-full border p-3 rounded mb-4 focus:outline-blue-500">
            <input type="password" id="password" placeholder="Contraseña de Administrador" class="w-full border p-3 rounded mb-4 focus:outline-blue-500 hidden">
            <button id="btn-entrar" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded w-full transition">
                Entrar
            </button>
        </div>

        <div id="pantalla-usuario" class="hidden">
            <h2 class="text-2xl font-bold text-gray-700 mb-2">Tu Pase de Lista</h2>
            <p class="text-gray-500 mb-6">Muestra este código al administrador</p>
            <div id="qr-contenedor" class="flex justify-center mb-6 p-4 bg-white border-4 border-blue-100 rounded-lg"></div>
            <p class="text-xl font-bold text-blue-600">ID: <span id="nombre-usuario">...</span></p>
        </div>

        <div id="pantalla-admin" class="hidden">
            <h2 class="text-2xl font-bold text-gray-700 mb-4">Panel de Escaneo</h2>
            
            <div id="lector-qr" class="w-full rounded overflow-hidden mb-4 border-2 border-gray-300"></div>
            
            <div id="formulario-puntos" class="hidden text-left bg-gray-50 p-4 rounded-lg border">
                <p id="usuario-detectado" class="font-bold text-blue-600 text-lg mb-4 text-center">Usuario detectado</p>
                
                <div class="space-y-3 mb-6">
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" value="5" class="w-5 h-5 text-blue-600">
                        <span class="text-gray-700">Asistencia (+5 pts)</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" value="5" class="w-5 h-5 text-blue-600">
                        <span class="text-gray-700">Trajo Biblia (+5 pts)</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" value="10" class="w-5 h-5 text-blue-600">
                        <span class="text-gray-700">Llegó Temprano (+10 pts)</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" value="10" class="w-5 h-5 text-blue-600">
                        <span class="text-gray-700">Trajo Invitado (+10 pts)</span>
                    </label>
                </div>
                
                <button id="btn-guardar-puntos" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded w-full transition">
                    Guardar Puntos
                </button>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
